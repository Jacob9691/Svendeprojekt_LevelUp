services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: levelup-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Sæt MSSQL_SA_PASSWORD i .env}
    ports:
      # 14330 på værten for ikke at konflikte med en lokal SQL Server på 1433
      - "14330:1433"
    volumes:
      - levelup-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  levelup-sqldata:
